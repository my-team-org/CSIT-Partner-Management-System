<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ยืนยันการลบงาน</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary-color: #F05A23; /* สีส้มหลัก */
            --danger-color: #dc3545; /* สีแดงสำหรับปุ่มลบ */
            --light-color: #FAEBE5; /* สีส้มอ่อนมาก */
        }
        
        body {
            background-color: var(--light-color);
            font-family: 'Kanit', 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .delete-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(240, 90, 35, 0.1);
            padding: 30px;
            width: 100%;
            max-width: 500px;
            border-top: 5px solid var(--primary-color);
            text-align: center;
        }
        
        .delete-icon {
            color: var(--danger-color);
            font-size: 4rem;
            margin-bottom: 20px;
        }
        
        .delete-title {
            color: var(--primary-color);
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        .job-info {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            text-align: left;
        }
        
        .job-info p {
            margin-bottom: 5px;
        }
        
        .btn-delete {
            background-color: var(--danger-color);
            border-color: var(--danger-color);
            padding: 10px 25px;
            font-weight: 500;
            margin-right: 10px;
        }
        
        .btn-cancel {
            background-color: #6c757d;
            border-color: #6c757d;
            padding: 10px 25px;
            font-weight: 500;
        }
        
        .btn-delete:hover {
            background-color: #bb2d3b;
            border-color: #b02a37;
        }
        
        .btn-cancel:hover {
            background-color: #5c636a;
            border-color: #565e64;
        }
    </style>
</head>
<body>
    <div class="delete-container">
        <i class="bi bi-exclamation-triangle-fill delete-icon"></i>
        <h2 class="delete-title">ยืนยันการลบงาน</h2>
        
        <p>คุณกำลังจะลบตำแหน่งงานต่อไปนี้:</p>
        
        <div class="job-info">
            <p><strong>ตำแหน่งงาน:</strong> {{ job.job_name }}</p>
            <p><strong>บริษัท:</strong> {{ job.company.name_th }}</p>
            <p><strong>วันที่ประกาศ:</strong> {{ job.job_posted|date:"d/m/Y" }}</p>
        </div>
        
        <p class="text-danger"><strong>การกระทำนี้ไม่สามารถยกเลิกได้!</strong></p>
        
        <form method="POST">
            {% csrf_token %}
            <div class="d-flex justify-content-center mt-4">
                <button type="submit" class="btn btn-delete">
                    <i class="bi bi-trash-fill"></i> ลบงาน
                </button>
                <a href="{% url 'job_list' %}" class="btn btn-cancel">
                    <i class="bi bi-x-circle"></i> ยกเลิก
                </a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
