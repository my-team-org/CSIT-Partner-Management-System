<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if form.instance.pk %}แก้ไขบริษัท{% else %}เพิ่มบริษัทใหม่{% endif %}</title>
    {% load static %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --orange-primary: #fd7e14;
            --orange-light: #ffc078;
            --orange-dark: #e8590c;
            --orange-bg: #fff5f0;
        }
        
        body {
            background-color: var(--orange-bg);
        }
        
        .custom-card {
            border: none;
            border-radius: 12px;
            overflow: hidden;
        }
        
        .card-header {
            background-color: var(--orange-primary);
            padding: 1.5rem;
        }
        
        .btn-orange {
            background-color: var(--orange-primary);
            color: white;
            font-weight: 500;
            padding: 10px 0;
            border: none;
        }
        
        .btn-orange:hover {
            background-color: var(--orange-dark);
            color: white;
        }
        
        .btn-purple {
            background-color: #6c757d;
            color: white;
            font-weight: 500;
            padding: 10px 0;
            border: none;
        }
        
        .btn-purple:hover {
            background-color: #5a6268;
            color: white;
        }
        
        .form-control:focus {
            border-color: var(--orange-light);
            box-shadow: 0 0 0 0.25rem rgba(253, 126, 20, 0.25);
        }
        
        .form-label {
            font-weight: 500;
            color: #495057;
        }
        
        /* Style form fields */
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        /* Style file input */
        .form-control-file {
            padding: 0.375rem 0.75rem;
        }
        
        /* Error messages */
        .errorlist {
            color: #dc3545;
            padding-left: 0;
            list-style: none;
            margin-top: 0.25rem;
            font-size: 0.875rem;
        }
    </style>
</head>

<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card custom-card shadow-lg">
                    <div class="card-header text-white text-center">
                        <h2 class="mb-0">
                            <i class="bi bi-building me-2"></i>
                            {% if form.instance.pk %}แก้ไขบริษัท{% else %}เพิ่มบริษัทใหม่{% endif %}
                        </h2>
                    </div>
                    <div class="card-body p-4">
                        <form method="POST" enctype="multipart/form-data" class="needs-validation" novalidate>
                            {% csrf_token %}
                            
                            {% for field in form %}
                            <div class="form-group mb-4">
                                <label for="{{ field.id_for_label }}" class="form-label">
                                    {{ field.label }}
                                    {% if field.field.required %}<span class="text-danger">*</span>{% endif %}
                                </label>
                                
                                {{ field }}
                                
                                {% if field.help_text %}
                                <small class="form-text text-muted">{{ field.help_text }}</small>
                                {% endif %}
                                
                                {% for error in field.errors %}
                                <div class="invalid-feedback d-block">
                                    {{ error }}
                                </div>
                                {% endfor %}
                            </div>
                            {% endfor %}
                            
                            <div class="d-grid gap-3 mt-4">
                                <button type="submit" class="btn btn-orange btn-lg">
                                    <i class="bi bi-save-fill me-2"></i>บันทึก
                                </button>
                                <a href="{% url 'company_own' %}" class="btn btn-purple btn-lg">
                                    <i class="bi bi-arrow-left-circle me-2"></i>ย้อนกลับ
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Form validation
        (function() {
            'use strict';
            
            // Fetch all the forms we want to apply custom Bootstrap validation styles to
            var forms = document.querySelectorAll('.needs-validation');
            
            // Loop over them and prevent submission
            Array.prototype.slice.call(forms)
                .forEach(function(form) {
                    form.addEventListener('submit', function(event) {
                        if (!form.checkValidity()) {
                            event.preventDefault();
                            event.stopPropagation();
                        }
                        
                        form.classList.add('was-validated');
                    }, false);
                });
        })();
        
        // Preview image before upload
        document.addEventListener('DOMContentLoaded', function() {
            const logoInput = document.querySelector('input[type="file"]');
            if (logoInput) {
                logoInput.addEventListener('change', function(e) {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = function(event) {
                            const preview = document.getElementById('logo-preview');
                            if (!preview) {
                                const previewDiv = document.createElement('div');
                                previewDiv.id = 'logo-preview';
                                previewDiv.className = 'mt-2 text-center';
                                previewDiv.innerHTML = `
                                    <img src="${event.target.result}" class="img-thumbnail" style="max-height: 150px;">
                                    <p class="small text-muted mt-2">ตัวอย่างโลโก้</p>
                                `;
                                logoInput.parentNode.appendChild(previewDiv);
                            } else {
                                preview.querySelector('img').src = event.target.result;
                            }
                        }
                        reader.readAsDataURL(file);
                    }
                });
            }
        });
    </script>
</body>
</html>
